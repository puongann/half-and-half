<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Half &amp; Half</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Sticker-style UI on a soft grid. Pink = the "If" half, blue = the main half, lilac = the third person. */
:root{
  --paper:#fffaf6; --grid:#f6e3ea; --ink:#43303f; --ink-soft:#7a6574; --card:#fff;
  --pink:#ffb3c7; --pink-deep:#e8557f; --blue:#a9d8ff; --blue-deep:#2f86d6; --lilac:#d6c4ff; --lilac-deep:#7a5ad8;
  --sun:#ffd166; --sun-deep:#e0a400; --mint:#7fd6a5; --mint-deep:#2f9e63; --red:#e84a4a; --line:#ecd9e0;
  --display:'Baloo 2','Nunito',ui-rounded,system-ui,sans-serif; --body:'Nunito',ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background-color:#fbe8f1;background-image:linear-gradient(rgba(255,255,255,.55) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.55) 2px,transparent 2px),linear-gradient(160deg,#ffe3ee 0%,#f3e5ff 45%,#e0f0ff 100%);background-size:44px 44px,44px 44px,100% 100%;background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit;color:inherit}
.btn{font:800 18px/1.1 var(--display);padding:12px 22px 10px;border:3px solid var(--ink);border-radius:999px;background:#fff;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:.4em}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--sun)} .btn.pink{background:var(--pink)} .btn.blue{background:var(--blue)} .btn.mint{background:var(--mint)}
.btn.small{font-size:15px;padding:8px 14px 6px;box-shadow:0 3px 0 var(--ink)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;padding:6px 8px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:20px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
.wide{max-width:1500px;margin:0 auto;padding:22px clamp(16px,3vw,40px) 50px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-soft)}
.center{text-align:center}
.logo{font:800 clamp(30px,5vw,58px)/1 var(--display);letter-spacing:-.5px}
.logo .h{color:var(--pink-deep)} .logo .b{color:var(--blue-deep)}
.tag{display:inline-block;font:800 14px/1 var(--display);padding:6px 12px 4px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.tag.pink{background:var(--pink)} .tag.blue{background:var(--blue)} .tag.lilac{background:var(--lilac)} .tag.sun{background:var(--sun)}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:800}
input[type=text],input[type=url],select,textarea{font-size:18px;padding:12px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--pink-deep)}
textarea{resize:none;min-height:96px;line-height:1.4}
.chk{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:2px solid var(--ink);border-radius:999px;background:#fff;cursor:pointer;font-weight:800;user-select:none}
.chk:has(input:checked){background:var(--sun)}
.chk input{width:18px;height:18px;accent-color:var(--ink)}
details summary{cursor:pointer;font-weight:800}
.err{background:#fff0f0;border:3px solid var(--red);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.err .ans{font-weight:900;color:var(--red)}
.err .hint{font-size:15px;color:var(--ink-soft)}
.warn{background:#fff8e6;border:3px solid #e0a100;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.warn .who{font:800 14px/1.2 var(--display);color:#9a6b00}
.warn .ans{font-weight:900;color:#9a6b00}
.warn .hint{font-size:15px;color:var(--ink-soft)}
.warn .note{font-size:14px;color:var(--ink-soft);border-top:2px dashed #e8c66a;padding-top:6px}
.warn .row{display:flex;gap:8px;flex-wrap:wrap}
.warn .row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;z-index:99;max-width:90vw;text-align:center}
/* Vietnamese on hover / tap */
.vi{position:absolute;left:0;top:calc(100% + 6px);transform:translateY(4px);z-index:50;width:max-content;max-width:min(320px,86vw);padding:.35em .7em;border-radius:10px;background:rgba(67,48,63,.9);color:#fff;font:600 13px/1.35 var(--body);text-align:center;white-space:normal;letter-spacing:0;text-transform:none;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,transform .2s,visibility .2s}
:where(h1,h2,h3,p,li,label,legend,summary,button,.btn,span,b,div):has(> .vi){position:relative}
.show-vi > .vi{opacity:.95;visibility:visible;transform:translateY(0)}
:where(button,.btn) > .vi{left:50%;transform:translate(-50%,4px)}
:where(button,.btn).show-vi > .vi{transform:translate(-50%,0)}
.err .vi,.warn .vi,.vi-below .vi{position:static;display:block;opacity:1;visibility:visible;transform:none;background:none;color:var(--ink-soft);padding:0;width:auto;max-width:none;text-align:left;font-size:.85em}

/* ---- tables grid ---- */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tbl{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:92px;box-shadow:0 4px 0 var(--ink)}
.tbl h3{font-size:18px;display:flex;justify-content:space-between;align-items:center}
.tbl.full{background:#f3eef1} .tbl.ready{background:#eafaf0} .tbl.solo{background:#fff8e6}
.chip{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:15px;padding:3px 10px;border-radius:999px;background:var(--grid);border:2px solid transparent;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role .who{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px}
.role .who .chip{cursor:default;font-size:14px}
.role .who .chip.me{border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.chip.r-if{background:var(--pink)} .chip.r-main{background:var(--blue)} .chip.r-x{background:var(--lilac)}
.chip .x{opacity:.5;font-size:13px}
button.tbl{cursor:pointer;text-align:left;font:inherit}
button.tbl:disabled{opacity:.45;cursor:not-allowed}
button.tbl.mine{background:var(--sun)}

/* ---- teacher ---- */
#rjq{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(460px,calc(100vw - 32px))}
#rjq:empty,#rjq[hidden]{display:none}
.rjrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff8e6;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;box-shadow:0 4px 0 var(--ink);font-weight:700}
#rjov{position:fixed;inset:0;z-index:90;background:rgba(67,48,63,.55);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#rjov > .card{width:min(560px,100%);max-height:100%;overflow:auto}
#rjov .rjqr{display:flex;justify-content:center}
#rjov .rjqr img,#rjov .rjqr canvas{width:min(300px,70vw)!important;height:auto!important}
#rjov .rjlist{display:flex;flex-direction:column;gap:8px}
.t-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.lobby{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:24px;align-items:start}
@media (max-width:860px){.lobby{grid-template-columns:1fr}}
#qr{background:#fff;padding:12px;border-radius:16px;display:flex;justify-content:center}
#qr img,#qr canvas{width:100%!important;max-width:300px;height:auto!important;image-rendering:pixelated}
.code{font:800 clamp(34px,4vw,54px)/1 var(--display);letter-spacing:2px;text-align:center}
.frame{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.frame>div{flex:1;min-width:200px;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font-weight:800}
.frame .fi{background:var(--pink)} .frame .fm{background:var(--blue)} .frame .fx{background:var(--lilac)}
.frame small{display:block;font-weight:600;font-style:italic;color:var(--ink-soft)}
.big-note{font:800 clamp(20px,2.2vw,30px)/1.2 var(--display)}

/* ---- reveal stage ---- */
.stage{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 0}
.stage .who{font:800 clamp(24px,3vw,44px)/1.1 var(--display);text-align:center}
.pairs{display:flex;flex-direction:column;gap:22px;width:100%;align-items:center}
.sent{display:flex;align-items:stretch;justify-content:center;gap:0;width:100%;flex-wrap:wrap;position:relative}
.half{font:700 clamp(22px,2.6vw,40px)/1.25 var(--display);padding:18px 26px;border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);background:#fff;max-width:46%;transition:transform .7s cubic-bezier(.2,1.4,.4,1),opacity .4s,border-radius .4s,margin .5s}
.half .lbl{display:block;font:800 14px/1 var(--body);letter-spacing:1px;text-transform:uppercase;opacity:.6;margin-bottom:6px}
.half.hi{background:var(--pink);border-radius:26px 6px 6px 26px}
.half.hm{background:var(--blue);border-radius:6px 26px 26px 6px;margin-left:-4px}
.half.hx{background:var(--lilac);border-radius:26px;margin-top:10px;flex-basis:100%;max-width:70%}
.sent.closed .hi{transform:translateX(-60vw) rotate(-10deg);opacity:0}
.sent.closed .hm{transform:translateX(60vw) rotate(10deg);opacity:0}
.sent.closed .hx{transform:translateY(40vh);opacity:0}
.sent.open .half{margin-left:0}
.sent.open .hm{margin-left:-4px}
.sent{padding-top:58px}
.pop{position:absolute;left:50%;top:0;font-size:48px;line-height:1;transform:translateX(-50%) scale(0);transition:transform .5s cubic-bezier(.2,1.8,.4,1) .55s;z-index:2}
.half .kw{font-weight:800;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
/* linking words: a chain link between the blocks */
.lnk{position:relative;z-index:3;align-self:center;margin:0 -18px;display:flex;align-items:center;transition:transform .5s cubic-bezier(.2,1.8,.4,1) .6s,opacity .3s .6s}
.lnk>span{font:800 clamp(20px,2.2vw,32px)/1 var(--display);text-transform:uppercase;letter-spacing:1px;background:var(--sun);border:4px solid var(--ink);border-radius:999px;padding:10px 18px 7px;box-shadow:0 5px 0 var(--ink);white-space:nowrap}
.lnk::before,.lnk::after{content:'';width:14px;height:10px;border:4px solid var(--ink);border-radius:999px;background:var(--sun)}
.lnk::before{margin-right:-4px} .lnk::after{margin-left:-4px}
.lnkrow{flex-basis:100%;display:flex;justify-content:center;margin:10px 0 -22px;position:relative;z-index:3}
.lnkrow .lnk{margin:0;flex-direction:column}
.lnkrow .lnk::before,.lnkrow .lnk::after{width:10px;height:14px}
.lnkrow .lnk::before{margin:0 0 -4px} .lnkrow .lnk::after{display:none}
.sent.linked .hm{margin-left:0}
.sent.closed .lnk{transform:scale(0);opacity:0}
.half .lbl{opacity:1}
.half.hi .lbl{color:#b8325b} .half.hm .lbl{color:#1f5f9e} .half.hx .lbl{color:#5a3cb0}
.nm{font-weight:800} .nm.n0{color:#d4446f} .nm.n1{color:#2a78c2} .nm.n2{color:#6d4fcf}
.sent.open .pop{transform:translateX(-50%) scale(1)}
@media (max-width:700px){.half{max-width:100%;flex-basis:100%}.half.hm{margin-left:0;margin-top:-4px}.half.hi{border-radius:22px 22px 6px 6px}.half.hm{border-radius:6px 6px 22px 22px}
  .sent>.lnk{flex-basis:100%;justify-content:center;margin:-16px 0;flex-direction:column}.sent>.lnk::after{display:none}.sent>.lnk::before{width:10px;height:14px;margin:0 0 -4px}.sent.linked .hm{margin-top:0}.half.hx{max-width:100%}}
.facedown{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.facedown div{width:min(300px,40vw);height:150px;border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);display:grid;place-items:center;font-size:56px;animation:wob 1.4s ease-in-out infinite}
.facedown .a{background:var(--pink)} .facedown .b{background:var(--blue);animation-delay:.2s} .facedown .c{background:var(--lilac);animation-delay:.4s}
@keyframes wob{50%{transform:rotate(-3deg) translateY(-4px)}}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;width:min(1100px,100%);background:#fff;border:3px solid var(--ink);border-radius:22px;padding:14px 20px;box-shadow:0 5px 0 var(--ink)}
@media (max-width:860px){.score{grid-template-columns:1fr}}
.votes{display:flex;flex-direction:column;gap:6px}
.vbar{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;font-weight:800}
.vbar .bar{height:18px;border-radius:999px;background:var(--grid);overflow:hidden}
.vbar .bar i{display:block;height:100%;background:var(--pink-deep);transition:width .4s}
.vbar.k1 .bar i{background:var(--sun-deep)} .vbar.k0 .bar i{background:var(--lilac-deep)}
.meter{text-align:center}
.meter .pct{font:800 clamp(46px,6vw,84px)/1 var(--display);color:var(--pink-deep)}
.hearts{display:flex;gap:4px;justify-content:center}
.hearts button{font-size:clamp(28px,3vw,40px);background:none;border:0;cursor:pointer;padding:2px;filter:grayscale(1);opacity:.35;transition:transform .15s}
.hearts button.on{filter:none;opacity:1}
.hearts button:hover{transform:scale(1.15)}
.badge{display:inline-block;font:800 18px/1 var(--display);background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:8px 14px 6px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ---- results ---- */
.rank{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:clamp(17px,1.6vw,22px)}
.rank td{background:#fff;padding:10px 14px;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.rank td:first-child{border-left:3px solid var(--ink);border-radius:16px 0 0 16px;font:800 1.3em/1 var(--display);text-align:center;width:60px}
.rank td:last-child{border-right:3px solid var(--ink);border-radius:0 16px 16px 0}
.rank tr.top td{background:#fff3c4}
.rank .num{font-weight:900;text-align:right;white-space:nowrap}
.rank th{text-align:left;font-size:14px;color:var(--ink-soft);padding:0 14px}
.podium{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:800px){.podium{grid-template-columns:1fr}}
.award{border:4px solid var(--ink);border-radius:26px;padding:22px;text-align:center;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;gap:8px;align-items:center}
.award.bff{background:linear-gradient(135deg,#ffd6e2,#ffeef3)} .award.chaos{background:linear-gradient(135deg,#e4dbff,#f3efff)}
.award .ico{font-size:clamp(50px,6vw,80px);line-height:1}
.award h2{font-size:clamp(26px,3vw,40px)}
.award .names{font:800 clamp(22px,2.4vw,34px)/1.2 var(--display)}

/* ---- phone ---- */
.p-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.role{border:3px solid var(--ink);border-radius:20px;padding:14px 16px;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;gap:6px}
.role.if{background:var(--pink)} .role.main{background:var(--blue)} .role.x{background:var(--lilac)}
.role h2{font-size:26px}
.role .form{font-weight:900;font-size:19px}
.role .ex{font-style:italic;font-size:15px}
.inrow{display:flex;align-items:flex-start;gap:8px}
.inrow .pre{font:800 24px/1 var(--display);padding-top:14px}
.locked{background:#eafaf0;border:3px solid var(--mint-deep);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.locked .txt{font:700 20px/1.3 var(--display)}
.shh{font-weight:800;text-align:center;background:#fff;border:2px dashed var(--ink);border-radius:14px;padding:8px}
.vote{display:grid;grid-template-columns:1fr;gap:10px}
.vote button{font:800 21px/1.1 var(--display);padding:14px;border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px}
.vote button .e{font-size:30px}
.vote button.on.k2{background:var(--pink)} .vote button.on.k1{background:var(--sun)} .vote button.on.k0{background:var(--lilac)}
.vote button.on{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.psent{font:700 21px/1.35 var(--display);background:#fff;border:3px solid var(--ink);border-radius:18px;padding:14px}
.psent .k{display:inline-block;font:800 .95em/1 var(--display);text-transform:uppercase;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:4px 8px 2px;margin:2px 0}
.psent .kw{font-weight:800;text-decoration:underline}
.psent .i{background:var(--pink);border-radius:6px;padding:0 4px} .psent .m{background:var(--blue);border-radius:6px;padding:0 4px} .psent .xx{background:var(--lilac);border-radius:6px;padding:0 4px}
.cert{background:linear-gradient(135deg,#fff1f6,#eef7ff);border:4px solid var(--ink);border-radius:26px;padding:22px;text-align:center;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;gap:10px;align-items:center}
.cert .pct{font:800 64px/1 var(--display);color:var(--pink-deep)}
.confetti{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:98;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
'use strict';
/* ================= CONFIG =================
   Không bắt buộc: dán Firebase Database URL vào đây để học viên tự gõ mã phòng
   mà không cần quét QR. Để trống thì game dùng URL đã lưu (kể cả URL đã lưu từ game Chó). */
const CONFIG = { DB_URL: '' };
/* ================= grammar checker (shared with the Chó game) ================= */
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================= grammar checker (present simple, subject–verb agreement) ================= */
const PRON = { i: 'non', you: 'non', we: 'non', they: 'non', he: '3', she: '3', it: '3' };
const ADV = new Set('always usually often sometimes never rarely seldom normally generally also still just even really frequently occasionally hardly then first already ever recently finally lately probably definitely certainly surely soon'.split(' '));
const MODAL = new Set("can could will would should must may might shall can't won't cannot couldn't shouldn't".split(' '));
const STRONG = new Set('get go brush wash take have eat drink watch play do make cook read sleep fall listen sing dance swim ride scroll study learn write clean run walk come sit buy meet chat call talk use check feed wake leave arrive return jog practice practise surf sweep fly'.split(' '));

  const L = lay(type, c, trio), cls = { if: 'if', main: 'main', main2: 'x', twist: 'x', link: 'x' }[role];
  const d = L[roleKey(role)], t = role === 'main2' ? Object.assign({}, L.b, L.b2) : d;
  return { cls, en: t.en, vi: t.vi, pre: d.pre, ph: d.ph, form: d.form, ex: d.ex };
}
// everyone's job in my group, e.g. "IF: you · MAIN: Lan · BUT: Chi"
// keep only the Vietnamese of a bilingual message (VI / BI → the .vi part)
function viOnly(html) {
  const t = document.createElement('template'); t.innerHTML = html || '';
  const pars = new Set([...t.content.querySelectorAll('.vi')].map(v => v.parentNode));
  pars.forEach(par => { const out = []; [...par.childNodes].filter(n => n.classList && n.classList.contains('vi')).forEach((v, i) => { if (i) out.push(document.createTextNode(' ')); out.push(...v.childNodes); }); par.replaceChildren(...out); });
  return t.innerHTML;
}
function whoLine(R, me) {
  const ro = me.ro, pass = isPass(R.meta.type), c = ro.c || [];
  const xl = R.meta.trio === 'twist' ? 'UNLESS' : R.meta.trio === 'two' ? 'MAIN 2' : (c[1] || 'and / so / but').toUpperCase();
  const rows = [['if', ro.if, pass ? 'Clause 1' : 'IF'], ['main', ro.main, pass ? 'Clause 2' : 'MAIN'], ['x', ro.x, pass ? 'Clause 3' : xl]].filter(r => r[1]);
  return `<div class="who">${rows.map(([k, pid, l]) => `<span class="chip r-${k}${pid === PID ? ' me' : ''}"><b>${esc(l)}:</b>${pid === PID ? '👉 YOU' : esc(pname(pid))}</span>`).join('')}</div>`;
}
function sWrite() {
  const R = curRound(), me = myRole(R);
  if (!me) return show('swx' + st().round, `<div class="wrap">${pHead()}<div class="card col center"><p style="font-size:48px">⏳</p><h2>${VI('You’ll play next round!', 'Bạn sẽ chơi ở vòng sau!')}</h2><p class="muted">${VI('You need a partner when the round starts.', 'Bạn cần có cặp khi vòng bắt đầu.')}</p></div></div>`);
  const T = TYPES[R.meta.type], ui = roleUI(me.role, R.meta.type, me.ro.c, R.meta.trio), checkRole = me.role === 'main2' ? 'main' : me.role;
  const ex = ui.ex;
  let editing = false;
  show('swr' + st().round, `<div class="wrap">${pHead()}
    <p class="muted center"><b>${VI(`Round ${st().round} · ${T.name}`, `Vòng ${st().round} · ${T.vn}`)}</b>${R.meta.theme ? ` · ${esc(R.meta.theme)}` : ''}</p>
    <div class="role ${ui.cls}">
      <h2>${VI(ui.en, ui.vi)}</h2>
      ${whoLine(R, me)}
      <p class="form">${esc(ui.form)}</p>
      <p class="ex">e.g. ${esc(ex)}</p>
      ${me.ro.c && me.ro.c.some(Boolean) ? `<p class="form">🔗 ${VI(`Your ${me.ro.x ? 'group' : 'pair'}’s linking word${me.ro.c.filter(Boolean).length > 1 ? 's' : ''}: ${me.ro.c.filter(Boolean).map(w => w.toUpperCase()).join(' · ')}`, 'Từ nối của nhóm bạn')}</p>
        <p class="ex">${esc(linkPreview(me.role, me.ro.c, R.meta.type))}</p>` : ''}
    </div>
    <p class="shh">🤐 ${VI(`With ${partnersLine(me.ro)} — no talking! Signs only.`, 'Không được nói chuyện! Chỉ ra hiệu thôi.')}</p>
    <div id="area"></div></div>`, null, () => {
    const R2 = curRound(); if (!R2) return;
    const mine = R2.h && R2.h[PID];
    if (mine && !editing) {
      $('#area').innerHTML = `<div class="locked"><b>✅ ${VI('Locked in! Keep it secret 🤫', 'Đã khoá! Giữ bí mật nhé 🤫')}</b>
        <p class="txt">${ui.pre ? esc(ui.pre) + ' ' : ''}${esc(mine.text)}</p>
        <button class="btn small" id="edit">✏️ ${VI('Change it', 'Sửa lại')}</button></div>`;
      $('#edit').onclick = () => { editing = true; $('#area').innerHTML = ''; screenUpdate(); $('#inp').value = mine.text; };
      return;
    }
    if ($('#inp')) return; // keep what they are typing
    $('#area').innerHTML = `<div class="card col">
      <div class="inrow">${ui.pre ? `<span class="pre">${ui.pre}</span>` : ''}<textarea id="inp" maxlength="170" placeholder="${esc(ui.ph)}" autocapitalize="sentences"></textarea></div>
      <div id="msg"></div>
      <button class="btn primary" id="send">🔒 ${VI('Check & lock in', 'Kiểm tra & khoá')}</button></div>`;
    const inp = $('#inp');
    const draftKey = 'cp_draft_' + CODE + '_' + st().round; inp.value = inp.value || LS.get(draftKey, '');
    inp.oninput = () => { LS.set(draftKey, inp.value); $('#msg').innerHTML = ''; };
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#send').click(); } };
    const lockIn = (text, warned) => {
      editing = false; LS.del(draftKey);
      put(`rounds/${roundKey(st().round)}/h/${PID}`, Object.assign({ text, at: Date.now() }, warned ? { warned: true } : {}));
    };
    $('#send').onclick = () => {
      const res = checkHalf(inp.value, checkRole, R.meta.type);
      if (res.empty) { $('#msg').innerHTML = `<div class="err"><b>${res.msg}</b></div>`; return; }
      if (res.ok) return lockIn(res.text);
      // only a suggestion: show it, let them fix or lock in anyway
      $('#msg').innerHTML = `<div class="warn">
        <span class="who">🤖 Máy gợi ý: câu này có thể chưa đúng</span>
        <b>${viOnly(res.msg)}</b>${res.ans ? `<span class="ans">Gợi ý sửa: ${esc(res.ans)}</span>` : ''}${res.hint ? `<span class="hint">${viOnly(res.hint)}</span>` : ''}
        <span class="note">Đây chỉ là gợi ý của máy, có thể sai. Bạn đọc kỹ lại câu nhé. Nếu chắc là đúng rồi thì cứ bấm khoá. Cả lớp sẽ cùng sửa câu sau.</span>
        <div class="row"><button class="btn small" id="fix">✏️ ${VI('Let me fix it', 'Để mình sửa')}</button><button class="btn small primary" id="anyway">🔒 ${VI('It’s right, lock it in', 'Đúng rồi, khoá luôn')}</button></div></div>`;
      $('#fix').onclick = () => { $('#msg').innerHTML = ''; inp.focus(); };
      $('#anyway').onclick = () => lockIn(res.text, true);
      $('#msg').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
  });
}
function sReveal() {
  const s = st(), R = curRound(); if (!R || !R.meta.order) return sWait();
  const i = Math.min(s.cur || 0, R.meta.order.length - 1), tk = R.meta.order[i], ro = R.meta.roles[tk];
  const own = [ro.if, ro.main, ro.x].includes(PID), slots = slotsOf(R, tk);
  const names = [ro.if, ro.main, ro.x].filter(Boolean).map(pname);
  if (!s.flipped) return show(`srv${s.round}_${i}_0`, `<div class="wrap">${pHead()}<div class="card col center"><p style="font-size:54px" class="spin">🧑‍🤝‍🧑</p>
    <h2>${own ? VI('It’s YOUR turn! 🙈', 'Tới lượt bạn rồi! 🙈') : VI('Next up…', 'Tiếp theo…')}</h2><p class="big-note">${namesC(names)}</p>
    <p class="muted">${VI('Look at the screen 👀', 'Nhìn lên màn hình nào 👀')}</p></div></div>`);
  show(`srv${s.round}_${i}_1`, `<div class="wrap">${pHead()}
    <p class="center"><b>${namesC(names)}</b></p>
    ${slots.map(sl => {
      const p = sentenceParts(R, R.meta.roles, tk, sl), H = halfTexts(R.meta.type, p);
      return `<div class="col" style="gap:10px"><p class="psent"><span class="i">${kwHTML(H.a)}</span>${H.kb ? ` <b class="k">${esc(H.kb)}</b>` : ''} <span class="m">${esc(H.b)}</span>${p.tw ? ` <b class="k">${esc(H.kx)}</b> <span class="xx">${esc(H.x)}</span>` : ''}</p>
        ${own ? '' : `<div class="vote" data-slot="${sl}">${VOTES.map(v => `<button class="k${v.k}" data-k="${v.k}"><span class="e">${v.e}</span><span>${VI(v.en, v.vi)}</span></button>`).join('')}</div>`}</div>`;
    }).join('<hr style="border:0;border-top:2px dashed var(--line);width:100%">')}
    ${own ? `<div class="card center"><p class="big-note">🙈 ${VI('This is you! The class is voting…', 'Là bạn đó! Cả lớp đang bình chọn…')}</p></div>` : `<p class="muted center">${VI('Do the two halves match?', 'Hai vế có hợp nhau không?')}</p>`}
  </div>`, () => {
    ROOT.querySelectorAll('.vote button').forEach(b => b.onclick = () => {
      const sl = b.closest('.vote').dataset.slot;
      put(`rounds/${roundKey(st().round)}/v/${sl}/${PID}`, +b.dataset.k);
    });
  }, () => {
    const R2 = curRound();
    ROOT.querySelectorAll('.vote').forEach(box => {
      const my = R2 && R2.v && R2.v[box.dataset.slot] ? R2.v[box.dataset.slot][PID] : undefined;
      box.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.k === my));
    });
  });
}
function sResults() {
  const fin = st().phase === 'final';
  const { rows, bff, chaos } = winners(), tk = 't' + myTable(), meRow = rows.find(r => r.tk === tk), rank = rows.indexOf(meRow) + 1;
  const award = fin && bff && bff.tk === tk ? ['🧑‍🤝‍🧑', 'Best Friends Forever', 'Bạn thân trọn đời'] : fin && chaos && chaos.tk === tk ? ['🤯', 'Chaos Kings', 'Vua hỗn loạn'] : null;
  show('sr' + st().phase + st().round + (meRow ? Math.round(meRow.compat) : ''), `<div class="wrap">${pHead()}
    ${meRow ? `<div class="cert">
      <p class="tag">${fin ? VI('Friendship certificate', 'Chứng nhận tình bạn') : VI(`After round ${st().round}`, `Sau vòng ${st().round}`)}</p>
      ${award ? `<p style="font-size:64px;line-height:1">${award[0]}</p><h2>${VI(award[1], award[2])}</h2>` : ''}
      <p class="big-note">${namesJoin(meRow.names)}</p>
      <p class="pct">${pct(meRow.compat)}</p><b>${VI('compatible', 'hợp nhau')}</b>
      <p>${VI(`Rank #${rank} of ${rows.length} · ${pct(meRow.chaos)} chaos`, `Hạng ${rank}/${rows.length}`)}</p>
      ${fin ? `<p class="muted" style="font-size:14px">📸 ${VI('Screenshot this!', 'Chụp màn hình lại nhé!')}</p>` : ''}
    </div>` : `<div class="card center"><p class="big-note">${VI('Look at the screen for the results! 🏆', 'Xem kết quả trên màn hình nhé! 🏆')}</p></div>`}
    ${!fin ? `<p class="muted center">${VI('Next round coming soon…', 'Sắp tới vòng tiếp theo…')}</p>` : ''}</div>`, () => { if (award) confetti(40); });
}

/* ---------- boot ---------- */
function boot() {
  if (!CODE) return render();
  if (!DB) DB = 'local';
  api = makeApi(DB);
  if (QS.get('host') && !isHost() && LS.get('cp_lastHost', {}).code === CODE) LS.set('cp_host_' + CODE, true);
  let first = true;
  stopListen = api.listen(CODE, data => {
    if (data == null) { if (first) { room = { __missing: true }; render(); } return; }
    first = false; room = data; render();
  });
  render();
}
boot();
</script>
